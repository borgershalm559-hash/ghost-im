[workspace]
resolver = "2"
members = [
    "apps/ghost-desktop",
    "crates/ghost-core",
    "crates/ghost-app",
    "crates/ghost-client",
    "crates/ghost-identity",
    "crates/ghost-network",
    "crates/ghost-identity-cli",
    "crates/ghost-protocol",
    "crates/ghost-server",
    "crates/ghost-storage",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Crypto primitives (ZeroizeOnDrop ensures secret keys cleared on drop)
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "zeroize"] }
x25519-dalek  = { version = "2.0", features = ["serde", "static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
blake3 = "1.5"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
bech32 = "0.11"
hex = "0.4"
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Networking
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "dns",
    "yamux",
    "noise",
    "tls",
    "quic",
    "kad",
    "identify",
    "request-response",
    "ed25519",
    "macros",
] }

# Errors / utilities
thiserror = "1.0"
anyhow = "1.0"
directories = "5.0"

# OS keystore (Linux Secret Service / Windows Credential Manager / macOS Keychain)
keyring = { version = "3.0", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

# MLS (RFC 9420)
openmls = { version = "0.8", features = ["test-utils"] }
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
openmls_basic_credential = "0.5"

# Identifiers
uuid = { version = "1.10", features = ["v7", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Tauri (desktop shell)
tauri = { version = "2", features = [] }
tauri-build = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test-only
proptest = "1.5"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true  # crypto correctness: keep arithmetic safety in release

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3  # optimize dependencies even in dev (crypto crates ~50x faster)

name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build + sign + release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write   # required for gh release create

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard placeholder owner/repo
        shell: pwsh
        run: |
          $conf = Get-Content apps/ghost-desktop/tauri.conf.json -Raw
          if ($conf -match 'OWNER_REPLACE_ME' -or $conf -match 'REPO_REPLACE_ME') {
            Write-Error "tauri.conf.json still contains OWNER_REPLACE_ME or REPO_REPLACE_ME. Fill in the real github coordinates before tagging a release. See docs/release-process.md."
            exit 1
          }
          if ($conf -match 'RWQ_PASTE_THE_BASE64_LINE_FROM') {
            Write-Error "tauri.conf.json still contains the placeholder pubkey. Run scripts/generate-minisign-keypair.sh and paste the real pubkey before releasing."
            exit 1
          }

      - name: Install Rust 1.87 (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87
          targets: x86_64-pc-windows-msvc

      - name: Install Strawberry Perl
        shell: pwsh
        run: choco install strawberryperl -y --no-progress

      - name: Install minisign 0.12
        shell: pwsh
        run: |
          # Use official binary directly. Chocolatey's `minisign` package lags
          # at 0.10/0.11 which lacks the `-W` flag and may not read unencrypted
          # secret keys (the format we generate locally via `minisign -G -W`).
          $url = "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\minisign.zip"
          Expand-Archive "$env:RUNNER_TEMP\minisign.zip" -DestinationPath "$env:RUNNER_TEMP\minisign"
          echo "$env:RUNNER_TEMP\minisign\minisign-win64\x86_64" >> $env:GITHUB_PATH

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install tauri-cli
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compute SOURCE_DATE_EPOCH
        id: source-date
        shell: bash
        run: echo "epoch=$(git log -1 --format=%ct)" >> $GITHUB_OUTPUT

      - name: Frontend deps + build
        shell: bash
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Tauri build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}
        run: |
          # Prepend Strawberry Perl so openssl-src (vendored OpenSSL build via
          # tauri's transitive deps) uses Strawberry's perl + its full
          # Locale::Maketext::Simple / Params::Check / IPC::Cmd modules.
          # MSYS perl at /usr/bin/perl lacks them and would break the build.
          export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          cargo +1.87-x86_64-pc-windows-msvc tauri build --config apps/ghost-desktop/tauri.conf.json

      - name: Locate MSI
        id: artifacts
        shell: bash
        run: |
          MSI="$(ls target/release/bundle/msi/Ghost_*.msi | head -1)"
          if [[ -z "${MSI}" ]]; then
            echo "ERROR: no .msi produced under target/release/bundle/msi/" >&2
            exit 1
          fi
          echo "msi_path=${MSI}" >> $GITHUB_OUTPUT
          echo "msi_name=$(basename ${MSI})" >> $GITHUB_OUTPUT

      - name: Sign MSI with minisign
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          # Write the secret to a temp file (minisign needs the key as a file).
          # Use a process-scoped tmpdir; GH Actions cleans it on job exit.
          KEYFILE="${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "${MINISIGN_PRIVATE_KEY}" > "${KEYFILE}"
          chmod 600 "${KEYFILE}"

          # The signing key is unencrypted (generated locally with `minisign -G -W`),
          # so no password is needed. minisign 0.12 reads the unencrypted key
          # transparently. `-x` forces the `.sig` extension; the default since
          # 0.12 is `.minisig`, but downstream steps and docs expect `.sig`.
          minisign -S -s "${KEYFILE}" \
            -m "${{ steps.artifacts.outputs.msi_path }}" \
            -x "${{ steps.artifacts.outputs.msi_path }}.sig"

          rm -f "${KEYFILE}"

      - name: Generate latest.json manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading v
          MSI_NAME="${{ steps.artifacts.outputs.msi_name }}"
          MSI_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${MSI_NAME}"
          # Tauri's updater plugin base64-decodes the signature field, then
          # parses the decoded text as a minisign signature file. So we must
          # base64-encode the raw .sig file's contents (multi-line text) here.
          SIG=$(base64 -w0 "${{ steps.artifacts.outputs.msi_path }}.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Notes from the tag annotation (if any).
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | head -c 4000)

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${NOTES}" \
            --arg pub_date "${PUB_DATE}" \
            --arg url "${MSI_URL}" \
            --arg signature "${SIG}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $signature,
                  url: $url
                }
              }
            }' > latest.json

          cat latest.json

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "${NOTES_FILE}"
          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "Release ${GITHUB_REF_NAME}" > "${NOTES_FILE}"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "Ghost ${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            "${{ steps.artifacts.outputs.msi_path }}" \
            "${{ steps.artifacts.outputs.msi_path }}.sig" \
            latest.json
